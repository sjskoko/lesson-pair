name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m unittest discover -s tests -v
      - run: python skills/lesson-pair/scripts/lesson_pair.py render examples/lesson.synthetic.json --out output/demo
      - run: python skills/lesson-pair/scripts/lesson_pair.py check output/demo/02-review.notion.md
