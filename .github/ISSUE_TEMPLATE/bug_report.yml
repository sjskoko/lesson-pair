name: Bug report
description: Report a reproducible problem using fictional data
body:
  - type: markdown
    attributes:
      value: "Use synthetic material only. Do not include private lesson notes, page URLs, screenshots, or credentials."
  - type: textarea
    id: behavior
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal synthetic reproduction
      description: Include your Python version and the command or host workflow.
    validations:
      required: true
