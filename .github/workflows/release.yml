name: Publish LessonPair release

on:
  push:
    branches: [main]
    paths: [.github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lessonpair-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'sjskoko/lesson-pair' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      statuses: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Report pending release
        run: >-
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"
          -f state=pending -f context=lessonpair/release
          -f description='Validating the plugin and preparing the release'
          -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          --silent
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Validate source, compatibility, and generated packages
        run: |
          python -m unittest discover -s tests -v
          python scripts/build_plugin.py --check
          python scripts/build_docs.py --check
          python scripts/check_docs.py
          python skills/lesson-pair/scripts/lesson_pair.py render examples/lesson.synthetic.json --out output/demo
          python skills/lesson-pair/scripts/lesson_pair.py check output/demo/02-review.notion.md
      - name: Package, publish, and verify the versioned plugin
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import urllib.error
          import urllib.request
          import zipfile

          repo, sha = os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_SHA']
          version = json.loads(Path('plugins/lesson-pair/plugin.json').read_text())['version']
          if not re.fullmatch(r'\d+\.\d+\.\d+', version):
              raise SystemExit('Release version must be a stable semantic version.')
          tag = 'v' + version
          base = 'https://api.github.com/repos/' + repo
          headers = {'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json',
                     'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                     'X-GitHub-Api-Version': '2022-11-28'}

          def api(path, payload=None, method=None, missing_ok=False):
              body = None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request(base + path, data=body, headers=headers,
                                               method=method or ('POST' if payload is not None else 'GET'))
              try:
                  with urllib.request.urlopen(request, timeout=45) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  status = error.code
                  error.close()
                  if status == 404 and missing_ok:
                      return None
                  raise SystemExit(f'GitHub API request failed (HTTP {status}); no credentials logged.') from None

          # Never move a tag or replace an already-published release.
          existing = api('/releases/tags/' + tag, missing_ok=True)
          ref = api('/git/ref/tags/' + tag, missing_ok=True)
          if ref and ref['object']['sha'] != sha:
              raise SystemExit('This version already points to another commit. Refusing to move it.')
          if existing and not existing['draft']:
              if not ref or existing['tag_name'] != tag:
                  raise SystemExit('Existing release could not be verified.')
              print('Already published and verified: ' + existing['html_url'])
          else:
              out = Path('dist')
              out.mkdir(exist_ok=True)
              archive = out / ('lesson-pair-plugin-' + tag + '.zip')
              package = Path('plugins/lesson-pair')
              with zipfile.ZipFile(archive, 'w', zipfile.ZIP_DEFLATED) as bundle:
                  for path in sorted(package.rglob('*')):
                      if path.is_file() and '__pycache__' not in path.parts and path.suffix != '.pyc':
                          info = zipfile.ZipInfo(str(path.relative_to(package)), (1980, 1, 1, 0, 0, 0))
                          info.compress_type = zipfile.ZIP_DEFLATED
                          info.external_attr = 0o100644 << 16
                          bundle.writestr(info, path.read_bytes())
              digest = hashlib.sha256(archive.read_bytes()).hexdigest()
              checksum = out / (archive.name + '.sha256')
              checksum.write_text(digest + '  ' + archive.name + '\n')
              notes = Path('CHANGELOG.md').read_text().split('## ' + version + '\n', 1)[1].split('\n## ', 1)[0].strip()
              notes += '\n\n## Install\n\nSee [the plugin guide](https://github.com/' + repo + '/blob/' + tag + '/docs/plugin.md). '
              notes += 'The attached ZIP contains the portable plugin; the repository also includes a marketplace. '
              notes += 'Host installation and public-directory approval are separate from this release. All public examples are synthetic.\n'
              notes += '\nVerified before publishing: 27 automated tests, plugin consistency, bilingual documentation, and legacy formatter checks.\n'
              release = existing or api('/releases', {'tag_name': tag, 'target_commitish': sha,
                  'name': 'LessonPair ' + tag + ' — your video, your AI, your English',
                  'body': notes, 'draft': True, 'prerelease': False})
              if release['target_commitish'] != sha:
                  raise SystemExit('Existing draft targets another commit; manual review required.')
              assets = {asset['name']: asset for asset in api('/releases/' + str(release['id']) + '/assets')}
              for artifact in (archive, checksum):
                  asset = assets.get(artifact.name)
                  expected_digest = 'sha256:' + hashlib.sha256(artifact.read_bytes()).hexdigest()
                  if asset:
                      if asset.get('digest') != expected_digest:
                          raise SystemExit('Existing draft asset differs; refusing to overwrite it.')
                  else:
                      subprocess.run(['gh', 'release', 'upload', tag, str(artifact), '--repo', repo], check=True)
              release = api('/releases/' + str(release['id']), {'draft': False, 'make_latest': 'true'}, method='PATCH')
              ref = api('/git/ref/tags/' + tag)
              if ref['object']['sha'] != sha or release['draft']:
                  raise SystemExit('Release verification failed.')
              names = {asset['name'] for asset in api('/releases/' + str(release['id']) + '/assets')}
              if not {archive.name, checksum.name}.issubset(names):
                  raise SystemExit('Release assets are missing.')
              print('Published and verified: ' + release['html_url'])
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write('## LessonPair release\n\n[' + tag + '](' + release['html_url'] + ')\n\nPlugin SHA-256: `' + digest + '`\n')
          PY
      - name: Report release result
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          if [ "$RESULT" = success ]; then
            RELEASE_STATE=success
            RELEASE_DESCRIPTION='Published release verified; all validation passed'
          else
            RELEASE_STATE=failure
            RELEASE_DESCRIPTION='Release incomplete; see workflow logs'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$RELEASE_STATE" -f context=lessonpair/release \
            -f description="$RELEASE_DESCRIPTION" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --silent
