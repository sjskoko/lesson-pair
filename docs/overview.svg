<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
<title id="title">LessonPair — turn corrections into practice</title>
<desc id="desc">Fictional example: the original Trees gives shade becomes Trees give shade, followed by a hidden-answer rewriting prompt.</desc>
<rect width="1200" height="440" rx="24" fill="#101b2b"/>
<text x="48" y="57" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#91efd4">LESSONPAIR / ENGLISH + NOTION</text>
<text x="48" y="111" font-family="DejaVu Sans,sans-serif" font-size="36" font-weight="700" fill="#ffffff">One correction. One more attempt.</text>
<rect x="48" y="151" width="330" height="207" rx="16" fill="#243449"/>
<rect x="435" y="151" width="330" height="207" rx="16" fill="#e8faf3"/>
<rect x="822" y="151" width="330" height="207" rx="16" fill="#c7f163"/>
<g font-family="DejaVu Sans,sans-serif">
<text x="70" y="192" font-size="14" font-weight="700" letter-spacing="1" fill="#b4c6dd">01 / KEEP THE ORIGINAL</text>
<text x="70" y="245" font-size="26" font-weight="700" fill="#ffffff">Trees gives shade.</text>
<text x="70" y="306" font-size="17" fill="#c6d2e3">Your exact words stay.</text>
<text x="457" y="192" font-size="14" font-weight="700" letter-spacing="1" fill="#29694e">02 / SEE THE CHANGE</text>
<text x="457" y="245" font-size="26" font-weight="700" fill="#123428">Trees give shade.</text>
<text x="457" y="306" font-size="17" fill="#29694e">Plural subject → give.</text>
<text x="844" y="192" font-size="14" font-weight="700" letter-spacing="1" fill="#344519">03 / TRY IT AGAIN</text>
<text x="844" y="239" font-size="26" font-weight="700" fill="#172317">Hide the answer.</text>
<text x="844" y="275" font-size="26" font-weight="700" fill="#172317">Write it again.</text>
<text x="844" y="320" font-size="17" fill="#344519">Then open the reveal.</text>
<text x="48" y="402" font-size="16" fill="#afc2da">Fictional example · Linked preparation + review · Open-source agent skill</text>
</g>
<path d="M391 255h30m-8-8 8 8-8 8M778 255h30m-8-8 8 8-8 8" stroke="#91efd4" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
